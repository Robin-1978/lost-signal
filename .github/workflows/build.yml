name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  content:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate content and locales
        run: |
          python3 tools/validate_content.py
          python3 tools/validate_locales.py
      - name: Test authored content contracts
        run: |
          python3 tests/test_content.py
          python3 tests/test_content_roundtrip.py
          python3 tests/test_contracts.py
      - name: Verify generated data and audio
        run: |
          python3 tools/generate_levels.py --check
          python3 tools/generate_contracts.py --week 1 --check
          python3 tools/generate_audio.py --check
      - name: Verify generated models and textures
        run: |
          python3 tools/generate_robot_models.py
          python3 tools/generate_actor_models.py
          python3 tools/generate_environment_models.py
          python3 tools/generate_textures.py
          git diff --exit-code -- assets/models assets/textures

  sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build/sanitizer
          -DLOST_SIGNAL_BUILD_CLIENT=OFF
          -DLOST_SIGNAL_BUILD_TESTS=ON
          -DLOST_SIGNAL_ENABLE_SANITIZERS=ON
          -DLOST_SIGNAL_WARNINGS_AS_ERRORS=ON
          -DCMAKE_BUILD_TYPE=Debug
      - name: Build sanitizer targets
        run: cmake --build build/sanitizer --parallel 2
      - name: Test with ASan and UBSan
        run: ctest --test-dir build/sanitizer --output-on-failure

  headless:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure portable C++ core
        run: >-
          cmake -S . -B build/headless
          -DLOST_SIGNAL_BUILD_CLIENT=OFF
          -DLOST_SIGNAL_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build portable C++ core
        run: cmake --build build/headless --config Release --parallel 2
      - name: Test portable C++ core
        run: ctest --test-dir build/headless -C Release --output-on-failure

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install platform development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev xvfb
      - name: Download dependencies, build and test
        run: ./tools/build.sh --test
      - name: Run deterministic mission
        run: ./build/release/lost_signal_headless --level lost_signal --recommended --json
      - name: Render a smoke-test frame
        run: xvfb-run -a ./build/release/lost_signal --demo --screenshot /tmp/lost-signal.png
